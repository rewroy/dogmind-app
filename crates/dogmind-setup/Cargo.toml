[package]
name = "dogmind-setup"
description = "Dogmind's installer: one executable with the package on its end"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "dogmind-setup"
path = "src/main.rs"

[dependencies]
# Nothing that is not already in this workspace: the package is deflated, file by file, and each file is checked by its hash.
flate2 = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# Only for the Start menu's shortcut, which is a COM object.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Globalization",
] }

[dev-dependencies]
tempfile = "3"
