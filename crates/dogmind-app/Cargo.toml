[package]
name = "dogmind-app"
description = "Dogmind as a native Windows application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "dogmind-app"
path = "src/main.rs"

[dependencies]
dogmind-agent = { path = "../dogmind-agent" }
# As dogmind-agent has it, for the same kinds of picture: small copies to show, and a pasted bitmap as a PNG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# An update is fetched, and what comes is checked by the SHA-256 GitHub published for it: as dogmind-agent has it. The files of a setup that is put together from parts are inflated to be checked.
flate2 = "1"
sha2 = "0.10"
# zip 2.6 needs both names to enable its flate2 decoder without the zopfli compressor.
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
# The terminal's screen: its grid, its scrollback, its selection and the parsing of what a shell writes (`term::screen`). Not its own pseudo console and its event loop: `term::pty` starts the shell, in a job that ends it with what it started.
alacritty_terminal = { version = "0.26", default-features = false }

[target.'cfg(windows)'.dependencies]
# The on-demand preview only; the loader is linked in, so there is no DLL to ship.
webview2-com = "0.39"
# The preview and the shell; what the window draws itself, through Direct2D and DirectWrite on the CPU (see render.rs); and the transcript's place in UI Automation (textview.rs).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility", "Networking_Connectivity"] }
# (what #[implement] names: the COM objects of textview's UI Automation)
windows-core = "0.62"
windows-numerics = "0.3"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Isolation",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Power",
    "Win32_Storage_Xps",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_Graphics",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
